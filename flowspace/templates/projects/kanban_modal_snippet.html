<!-- Substitua o conteúdo do modal #new-task-modal no kanban.html por este -->
<!-- New Task Modal -->
<div class="modal-overlay" id="new-task-modal">
  <div class="modal-box" style="max-width:520px">
    <div class="modal-header">
      <div class="modal-title">Nova Tarefa</div>
      <button class="modal-close" onclick="closeNewTask()">✕</button>
    </div>
    <form id="new-task-form">
      {% csrf_token %}
      <input type="hidden" id="nt-column" name="column">
      <div class="form-group">
        <label class="form-label">Título *</label>
        <input type="text" name="title" class="form-control" placeholder="O que precisa ser feito?" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">Descrição</label>
        <textarea name="description" class="form-control" rows="3" placeholder="Contexto, detalhes, critérios de aceite..."></textarea>
      </div>
      <div class="form-grid-2">
        <div class="form-group">
          <label class="form-label">Prioridade</label>
          <select name="priority" class="form-control">
            <option value="urgent">🔴 Urgente</option>
            <option value="high">🟠 Alta</option>
            <option value="medium" selected>🔵 Média</option>
            <option value="low">🟢 Baixa</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Prazo (data)</label>
          <input type="date" name="due_date" class="form-control">
        </div>
      </div>
      <div class="form-grid-2">
        <div class="form-group">
          <label class="form-label">Estimativa (dias)</label>
          <input type="number" name="deadline_days" class="form-control" min="1" placeholder="Ex: 3">
          <div class="form-hint">Dias para rastrear adiantamento/atraso</div>
        </div>
        <div class="form-group" style="display:flex;align-items:center;gap:10px;padding-top:22px">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--text2)">
            <input type="checkbox" name="needs_review" value="1"
                   style="width:16px;height:16px;accent-color:var(--amber)">
            🔍 Precisa de revisão
          </label>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Responsáveis</label>
        <select name="assignees" class="form-control" multiple size="4">
          {% for u in all_users %}
          <option value="{{ u.id }}">{{ u.get_full_name|default:u.username }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Tags (separar por vírgula)</label>
        <input type="text" name="tags" class="form-control" placeholder="Design, Dev, Urgente">
      </div>
      <div class="form-group">
        <label class="form-label">Subtarefas (uma por linha)</label>
        <textarea name="subtasks" class="form-control" rows="3" placeholder="Pesquisa de referências&#10;Criar wireframe&#10;Aprovar com cliente"></textarea>
      </div>
      <div style="display:flex;gap:8px;margin-top:6px">
        <button type="submit" class="btn btn-primary" style="flex:1">Criar Tarefa</button>
        <button type="button" class="btn btn-ghost" onclick="closeNewTask()">Cancelar</button>
      </div>
    </form>
  </div>
</div>
