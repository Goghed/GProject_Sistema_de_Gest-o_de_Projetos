{% extends "base.html" %}
{% block title %}Novo Projeto — G Project{% endblock %}
{% block page_title %}Criar Projeto{% endblock %}
{% block content %}
<div style="max-width:580px;margin:0 auto">
<form method="post" action="{% url 'projects:create' %}">
{% csrf_token %}
<div class="card fade-up">
  <div class="section-title" style="margin-bottom:20px">Informações do Projeto</div>
  <div class="form-group">
    <label class="form-label">Nome do Projeto *</label>
    <input type="text" name="name" class="form-control" required placeholder="Ex: Website Redesign Q2">
  </div>
  <div class="form-group">
    <label class="form-label">Descrição</label>
    <textarea name="description" class="form-control" rows="3"
              placeholder="Objetivo, contexto e principais entregáveis..."></textarea>
  </div>
  <div class="form-grid-2">
    <div class="form-group">
      <label class="form-label">Data de Início</label>
      <input type="date" name="start_date" class="form-control">
    </div>
    <div class="form-group">
      <label class="form-label">Prazo Final</label>
      <input type="date" name="due_date" class="form-control">
    </div>
  </div>
  <div class="form-group">
    <label class="form-label">Cor do Projeto</label>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px" id="color-swatches">
      {% for color, name in colors %}
      <label style="cursor:pointer">
        <input type="radio" name="color" value="{{ color }}"
               {% if forloop.first %}checked{% endif %}
               style="display:none"
               onchange="updateSwatch()">
        <div class="swatch" data-color="{{ color }}"
             style="width:28px;height:28px;border-radius:50%;background:{{ color }};cursor:pointer;
                    border:{% if forloop.first %}3px solid white;box-shadow:0 0 0 2px {{ color }}{% else %}2px solid transparent{% endif %}"
             onclick="selectSwatch(this,'{{ color }}')">
        </div>
      </label>
      {% endfor %}
    </div>
  </div>
</div>
<div style="display:flex;gap:10px;margin-top:14px">
  <button type="submit" class="btn btn-primary">Criar Projeto →</button>
  <a href="{% url 'projects:dashboard' %}" class="btn btn-ghost">Cancelar</a>
</div>
</form>
</div>
<script>
function selectSwatch(el, color) {
  document.querySelectorAll('#color-swatches .swatch').forEach(s => {
    s.style.border = '2px solid transparent';
    s.style.boxShadow = 'none';
  });
  el.style.border = '3px solid white';
  el.style.boxShadow = `0 0 0 2px ${color}`;
  el.closest('label').querySelector('input').checked = true;
}
</script>
{% endblock %}
