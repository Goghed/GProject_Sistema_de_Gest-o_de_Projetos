<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Defina sua senha — G Project</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root {
  --accent:  #5b4cf5;
  --accent2: #7c6ffa;
  --ink:     #0a0a0f;
  --ink2:    #13131f;
  --text:    #e8e6ff;
  --text2:   rgba(232,230,255,.65);
  --text3:   rgba(232,230,255,.35);
}
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--ink);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.card {
  width: 100%;
  max-width: 380px;
  background: var(--ink2);
  border: 1px solid rgba(91,76,245,.22);
  border-radius: 18px;
  padding: 32px 28px;
}
.icon {
  width: 48px; height: 48px; border-radius: 12px;
  background: rgba(91,76,245,.15); border: 1px solid rgba(91,76,245,.3);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; margin-bottom: 18px;
}
h1 {
  font-family: 'Syne', sans-serif; font-size: 21px; font-weight: 800;
  color: var(--text); letter-spacing: -.5px; margin-bottom: 6px;
}
p.sub { font-size: 13px; color: var(--text2); line-height: 1.55; margin-bottom: 24px; }
.input-wrap { margin-bottom: 14px; }
.input-wrap label {
  display: block; font-size: 11px; font-weight: 600; color: var(--text3);
  text-transform: uppercase; letter-spacing: .07em; margin-bottom: 6px;
}
.input-wrap input {
  width: 100%; background: rgba(255,255,255,.05); border: 1px solid rgba(91,76,245,.2);
  color: var(--text); border-radius: 10px; padding: 12px 14px; font-size: 14px;
  font-family: 'DM Sans', sans-serif; outline: none; transition: border-color .2s, background .2s;
}
.input-wrap input:focus { border-color: var(--accent); background: rgba(91,76,245,.07); }
.btn { width: 100%; padding: 13px; background: var(--accent); color: #fff; border: none;
  border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 6px;
  transition: background .18s; font-family: 'DM Sans', sans-serif; }
.btn:hover { background: var(--accent2); }
.error-box {
  background: rgba(220,38,38,.1); border: 1px solid rgba(220,38,38,.25); color: #fca5a5;
  border-radius: 10px; padding: 10px 13px; font-size: 13px; margin-bottom: 16px;
}
.hint { font-size: 11px; color: var(--text3); margin-top: 18px; line-height: 1.6; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">🔒</div>
  <h1>Defina sua nova senha</h1>
  <p class="sub">Por segurança, você precisa criar uma senha própria antes de continuar.</p>

  {% if error %}
  <div class="error-box">{{ error }}</div>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <div class="input-wrap">
      <label for="id_new">Nova senha</label>
      <input type="password" name="new_password" id="id_new" autocomplete="new-password" required autofocus>
    </div>
    <div class="input-wrap">
      <label for="id_confirm">Confirmar nova senha</label>
      <input type="password" name="confirm_password" id="id_confirm" autocomplete="new-password" required>
    </div>
    <button type="submit" class="btn">Salvar e continuar</button>
  </form>

  <div class="hint">Mínimo de 8 caracteres. Evite senhas óbvias ou parecidas com seus dados pessoais.</div>
</div>
</body>
</html>
